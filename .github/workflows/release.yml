# Rebuilds the upstream webhook.site image. This repository holds no sources of
# its own: the workflow resolves a commit in webhooksite/webhook.site, checks
# out that commit and builds its Dockerfile.
#
# Why it tracks commits rather than releases: upstream tags releases roughly
# once every few years (1.3 in 2023, 1.2 in 2021) while master keeps moving, so
# a release-only trigger would sit silent for years behind live changes. The
# upstream release is still recorded as an image label and in the release notes,
# it just does not gate the build. Set UPSTREAM_REF below to pin a tag instead.
name: release

on:
  schedule:
    # Daily. Upstream rarely moves, so the run is usually a no-op that costs one
    # API call and exits.
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if this upstream commit was already built'
        type: boolean
        default: false
  push:
    branches:
      - master
    paths:
      - '.github/workflows/release.yml'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  UPSTREAM_REPO: webhooksite/webhook.site
  # Branch or tag to build from. Change to a tag (e.g. '1.3') to pin a release.
  UPSTREAM_REF: master

jobs:
  # Resolve what upstream currently is and decide whether it is already built.
  # The check is the registry itself rather than a state file in this repo: the
  # image either exists under that tag or it does not, so a failed or half
  # finished run leaves nothing stale behind.
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      sha: ${{ steps.upstream.outputs.sha }}
      short_sha: ${{ steps.upstream.outputs.short_sha }}
      tag: ${{ steps.upstream.outputs.tag }}
      release: ${{ steps.upstream.outputs.release }}
    steps:
      - name: Resolve upstream commit and release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          commit="$(gh api "repos/${UPSTREAM_REPO}/commits/${UPSTREAM_REF}")"
          sha="$(echo "$commit" | jq -r '.sha')"
          short_sha="${sha:0:7}"
          # Committer date, i.e. when the commit landed on the branch, in UTC as
          # the API returns it. This is both the image tag and the freshness
          # signal: a newer date upstream means there is something to build.
          date="$(echo "$commit" | jq -r '.commit.committer.date' | cut -dT -f1 | tr -d -)"
          # Newest upstream release, for labelling only. Upstream may have none.
          release="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq '.tag_name' 2>/dev/null || echo 'none')"
          tag="${date}"
          echo "upstream ${UPSTREAM_REPO}@${UPSTREAM_REF} -> ${sha}"
          echo "  last commit date: ${date}"
          echo "  newest release:   ${release}"
          echo "  image tag:        ${tag}"
          {
            echo "sha=${sha}"
            echo "short_sha=${short_sha}"
            echo "tag=${tag}"
            echo "release=${release}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether to build
        id: decide
        run: |
          set -uo pipefail
          image="${REGISTRY}/${IMAGE_NAME}:${{ steps.upstream.outputs.tag }}"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "forced rebuild requested"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "$image already exists → nothing to do"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "$image not found → build"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.should_build == 'true'
    steps:
      - name: Check out upstream sources
        uses: actions/checkout@v5
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.check.outputs.sha }}
          path: upstream

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.check.outputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ env.UPSTREAM_REPO }}
            org.opencontainers.image.revision=${{ needs.check.outputs.sha }}
            org.opencontainers.image.version=${{ needs.check.outputs.tag }}
            pro.hornigan.upstream.release=${{ needs.check.outputs.release }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./upstream
          # Upstream builds on node:11 and bkuhl/fpm-nginx:7.4, neither of which
          # publishes arm64. Pinning amd64 makes that an explicit choice rather
          # than a confusing manifest error.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.check.outputs.tag }}
          name: ${{ needs.check.outputs.tag }}
          body: |
            Built from [${{ env.UPSTREAM_REPO }}@${{ needs.check.outputs.short_sha }}](https://github.com/${{ env.UPSTREAM_REPO }}/commit/${{ needs.check.outputs.sha }}).

            Newest upstream release at build time: `${{ needs.check.outputs.release }}`.

            ```
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.check.outputs.tag }}
            ```
          token: ${{ secrets.GITHUB_TOKEN }}
