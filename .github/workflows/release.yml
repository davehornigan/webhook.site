# Rebuilds the upstream webhook.site image. This repository holds no sources of
# its own: the workflow resolves a commit in webhooksite/webhook.site, checks
# out that commit and builds its Dockerfile.
#
# Why it tracks commits rather than releases: upstream tags releases roughly
# once every few years (1.3 in 2023, 1.2 in 2021) while master keeps moving, so
# a release-only trigger would sit silent for years behind live changes. The
# upstream release is recorded as a label, it just does not gate the build.
# Set UPSTREAM_REF to a tag to pin a release instead.
name: release

on:
  schedule:
    # Upstream averages one or two commits a month, so daily is ample. A run
    # with nothing new costs one API call and one registry read, then exits.
    #
    # Caveat: GitHub disables cron in a public repository after 60 days with no
    # repository activity, and scheduled runs do not count as activity. This
    # repo gets commits rarely, so expect that mail eventually and re-enable
    # the schedule from the Actions tab.
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build even if the published image already matches upstream'
        type: boolean
        default: false
  push:
    branches:
      - master
    paths:
      - '.github/workflows/release.yml'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  UPSTREAM_REPO: webhooksite/webhook.site
  # Branch or tag to build from. Set to a tag (e.g. '1.3') to pin a release.
  UPSTREAM_REF: master
  # Carries the upstream commit timestamp, which the standard OCI labels do not:
  # image.created is when the build ran, not when the commit landed.
  LABEL_COMMITTED: pro.hornigan.upstream.committed
  LABEL_RELEASE: pro.hornigan.upstream.release

jobs:
  # Compares the published image against upstream and decides whether there is
  # anything to build.
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      sha: ${{ steps.upstream.outputs.sha }}
      short_sha: ${{ steps.upstream.outputs.short_sha }}
      tag: ${{ steps.upstream.outputs.tag }}
      committed: ${{ steps.upstream.outputs.committed }}
      release: ${{ steps.upstream.outputs.release }}
    steps:
      - name: Resolve upstream commit
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # One call, so the sha and the timestamp always describe the same
          # commit; two calls could straddle a push.
          commit="$(gh api "repos/${UPSTREAM_REPO}/commits/${UPSTREAM_REF}")"
          sha="$(jq -r '.sha' <<<"$commit")"
          committed="$(jq -r '.commit.committer.date' <<<"$commit")"
          release="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq '.tag_name' 2>/dev/null || echo 'none')"
          # Tag is the commit timestamp in UTC, minute precision: numeric, so it
          # sorts correctly for both humans and Flux image policies without any
          # tag filtering. The sha lives in the labels instead.
          tag="$(date -u -d "$committed" +%Y%m%d%H%M)"
          {
            echo "sha=${sha}"
            echo "short_sha=${sha:0:7}"
            echo "committed=${committed}"
            echo "tag=${tag}"
            echo "release=${release}"
          } >> "$GITHUB_OUTPUT"
          echo "upstream ${UPSTREAM_REPO}@${UPSTREAM_REF}"
          echo "  commit:    ${sha}"
          echo "  committed: ${committed}"
          echo "  release:   ${release}"
          echo "  image tag: ${tag}"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read labels off the published image
        id: published
        run: |
          set -uo pipefail
          image="${REGISTRY}/${IMAGE_NAME}:latest"
          # Reads the config blob only; layers are never fetched. Absent on the
          # very first run, which is not an error.
          labels="$(docker buildx imagetools inspect "$image" --format '{{json .Image.Config.Labels}}' 2>/dev/null || true)"
          if [ -z "$labels" ] || [ "$labels" = "null" ]; then
            echo "no published :latest yet"
            echo "sha=" >> "$GITHUB_OUTPUT"
            echo "committed=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha="$(jq -r '."org.opencontainers.image.revision" // ""' <<<"$labels")"
          committed="$(jq -r --arg k "$LABEL_COMMITTED" '.[$k] // ""' <<<"$labels")"
          echo "published :latest -> ${sha:-unknown} committed ${committed:-unknown}"
          {
            echo "sha=${sha}"
            echo "committed=${committed}"
          } >> "$GITHUB_OUTPUT"

      - name: Decide whether to build
        id: decide
        env:
          UP_SHA: ${{ steps.upstream.outputs.sha }}
          UP_COMMITTED: ${{ steps.upstream.outputs.committed }}
          PUB_SHA: ${{ steps.published.outputs.sha }}
          PUB_COMMITTED: ${{ steps.published.outputs.committed }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -uo pipefail
          build() { echo "$1"; echo "should_build=true" >> "$GITHUB_OUTPUT"; exit 0; }
          skip()  { echo "$1"; echo "should_build=false" >> "$GITHUB_OUTPUT"; exit 0; }

          [ "${{ inputs.force }}" = "true" ] && build "forced rebuild requested"
          [ -z "$PUB_SHA" ] && build "nothing published yet"
          [ "$PUB_SHA" = "$UP_SHA" ] && skip "published image is already this commit"

          # The sha differs, so something changed. Only move forward: an upstream
          # force-push that rewinds master would otherwise be rebuilt as if new.
          if [ -n "$PUB_COMMITTED" ]; then
            up="$(date -u -d "$UP_COMMITTED" +%Y%m%d%H%M%S)"
            pub="$(date -u -d "$PUB_COMMITTED" +%Y%m%d%H%M%S)"
            [ "$up" -le "$pub" ] && skip "upstream ${UP_SHA:0:7} (${UP_COMMITTED}) is not newer than published ${PUB_SHA:0:7} (${PUB_COMMITTED}) -- refusing to build backwards"
          fi

          # Secondary guard: never silently overwrite an existing tag.
          if docker manifest inspect "${REGISTRY}/${IMAGE_NAME}:${TAG}" >/dev/null 2>&1; then
            skip "tag ${TAG} already exists; re-run with force to overwrite"
          fi
          build "upstream ${UP_SHA:0:7} (${UP_COMMITTED}) is newer than published ${PUB_SHA:0:7} (${PUB_COMMITTED})"

  build:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.should_build == 'true'
    steps:
      - name: Check out this repository
        uses: actions/checkout@v5

      - name: Check out upstream sources
        uses: actions/checkout@v5
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.check.outputs.sha }}
          path: upstream

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.check.outputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ env.UPSTREAM_REPO }}
            org.opencontainers.image.revision=${{ needs.check.outputs.sha }}
            org.opencontainers.image.version=${{ needs.check.outputs.tag }}
            ${{ env.LABEL_COMMITTED }}=${{ needs.check.outputs.committed }}
            ${{ env.LABEL_RELEASE }}=${{ needs.check.outputs.release }}

      # Two steps because the published image is upstream's build plus a thin
      # overlay: upstream ships pdo_mysql and pdo_sqlite but no pdo_pgsql, and
      # sqlite is not usable on NFS-backed storage. The first build stays in the
      # local daemon and is never pushed.
      - name: Build upstream
        uses: docker/build-push-action@v7
        with:
          context: ./upstream
          # Upstream builds on node:11 and bkuhl/fpm-nginx:7.4, neither of which
          # publishes arm64. Pinning amd64 makes that an explicit choice rather
          # than a confusing manifest error.
          platforms: linux/amd64
          load: true
          tags: upstream-build:${{ needs.check.outputs.tag }}
          cache-from: type=gha,scope=upstream
          cache-to: type=gha,scope=upstream,mode=max

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            BASE=upstream-build:${{ needs.check.outputs.tag }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=overlay
          cache-to: type=gha,scope=overlay,mode=max

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.check.outputs.tag }}
          name: ${{ needs.check.outputs.tag }}
          body: |
            Built from [`${{ needs.check.outputs.short_sha }}`](https://github.com/${{ env.UPSTREAM_REPO }}/commit/${{ needs.check.outputs.sha }}) committed ${{ needs.check.outputs.committed }}.

            Newest upstream release at build time: `${{ needs.check.outputs.release }}`.

            ```
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.check.outputs.tag }}
            ```
          # PAT so releases are attributed to the account rather than
          # github-actions[bot], matching the other repositories.
          token: ${{ secrets.PAT }}
